name: Check Commits

on: 
  pull_request:

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Called directly, with the default report: fail, so that the action itself
    # writes the annotations and fails the check.
    - uses: FlowingCode/action-conventional-commits@feature/wip-action-required
