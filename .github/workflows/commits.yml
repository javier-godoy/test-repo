name: Check Commits

on: 
  pull_request:

jobs:
  check-commits:
    # The called workflow asks for checks: write, which it cannot be granted
    # unless this job has it: without this block the run fails at startup.
    permissions:
      contents: read
      checks: write
    uses: FlowingCode/GithubActions/.github/workflows/check-commits.yml@feature/wip-action-required
