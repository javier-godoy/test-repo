name: Probe self-patch

on:
  push:
    branches: [ test/probe-protection ]

jobs:
  selfpatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Try to set this job's own check run to action_required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.sha }}
          ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=selfpatch" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "SELFPATCH own check run id = $ID"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/$ID" \
            -d '{"status":"completed","conclusion":"action_required","output":{"title":"patched","summary":"patched from inside the job"}}')
          echo "SELFPATCH patch -> HTTP $code"
          echo "SELFPATCH conclusion right after patch: $(grep -o '"conclusion": *"[^"]*"' /tmp/r.json | head -1)"
