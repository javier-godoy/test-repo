name: Check Commits

on: 
  pull_request:

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # The reusable workflow in FlowingCode/GithubActions points at another branch of the
    # action, so the branch under test is called directly. It reports for itself: this
    # branch of the action has no report input.
    - uses: FlowingCode/action-conventional-commits@fix/read-all-commits
